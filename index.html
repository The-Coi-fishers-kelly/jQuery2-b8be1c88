<!DOCTYPE html>
<html>
    <head>
        <title>Welkom bij Vierkanten en Rechthoeken</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
        <link rel="stylesheet" href="styles.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    </head>
<body>

    <header class="w3-bar w3-blue">
        <p class="w3-bar-item">Start project webdesign</p>
    </header>

    <main class="w3-container">
        <div class="vierkant-column">
            <div class="vierkant-row">
                <div class="vierkant w3-red border w3-margin"></div>
                <div id="double" class="vierkant-special w3-blue border w3-margin"></div>
                <div id="vierkant-ho" class="vierkant-special w3-green border w3-margin"></div>
                <div id="mouse" class="vierkant w3-yellow border w3-margin"></div>
            </div>
            <div class="vierkant-row">
                <div id="fill-me" class="rechthoek w3-red border w3-margin">fill me</div>
                <div class="rechthoek w3-blue border w3-margin">
                    <dialog id="trailer-dialog" class="trailer-dialog">
                    
                    <p id="trailer-status">The trailer video will be added later.</p>

                    <p>
                       read me
                    </p>

                    <button id="close-trailer" type="button">
                        Close
                    </button>

                </dialog>
              </div>
                <div class="rechthoek w3-green border w3-margin"></div>
                <div class="rechthoek w3-yellow border w3-margin"></div>
            </div>
            <div class="vierkant-row">
                <div class="vierkant w3-red border w3-margin"></div>
            </div>
            <div class="vierkant-row">
                <div class="rechthoek w3-red border w3-margin"></div>
            </div>
        </div>
    </main>

    <footer class="w3-bottom w3-bar w3-blue">
        <p class="w3-bar-item w3-center">© 2026 by @KellyIgbokweKuti</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
